name = "lpr-tools"
main = "worker/index.js"
compatibility_date = "2026-03-08"

[assets]
directory = "./dist"
binding = "ASSETS"
# 只有 /api/* 进入 Worker，其余请求由静态资源直接响应
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "LPR_KV"
id = "ac11a5bb713f4be9a8c54359f27ab040"

[triggers]
# Cron 按 UTC 计。LPR 每月 20 日（遇节假日顺延）北京时间 9:00 发布，中行页面通常晚一到两小时更新：
# - 20–31 日北京时间 10:00–18:00 每小时一次，抓到本期后直到下月 20 日都直接跳过，不请求中行
# - 每月 1 日北京时间 10:00 做一次核对，发现中行对历史数据的更正（需与 worker/index.js 的 MONTHLY_CHECK_CRON 一致）
crons = ["0 2-10 20-31 * *", "0 2 1 * *"]

[observability]
enabled = true
